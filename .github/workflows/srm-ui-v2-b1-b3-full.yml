# 中文：SRM UI V2 B1+B2+B3 联合完整验收；固定开发分支，主线和真实数据不受影响。
# English: Combined UI V2 acceptance on the isolated feature branch; never writes to main or real user data.
name: SRM UI V2 B1-B3 Full Integration Acceptance
on:
  push:
    branches:
      - feat/20261015-ui-v2-b3-quote-comparison
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all isolated Python backend logic tests
        run: python -m unittest discover -v -s prototype/m1-lite/backend -p 'test_*.py'
      - name: Run all Node business invariants
        run: npm test
      - name: Real Chromium full RFQ workflows and all UI V2 cases
        run: npm run test:e2e
      - name: Capture screenshots traces and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srm-ui-v2-b1-b3-full-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SQLite backup restore and local API regression
        run: python -m unittest discover -v -s prototype/m1-lite/backend -p "test_*.py"
      - name: Run Node quote and supplier package tests
        run: node --test prototype/m1-lite/tests/autosave_rules.test.cjs prototype/m1-lite/tests/supplier_package.test.cjs
      - name: Verify ASCII Windows launcher
        shell: pwsh
        run: |
          $data = [System.IO.File]::ReadAllBytes("prototype/m1-lite/run_local.bat")
          if ($data | Where-Object { $_ -ge 128 }) { throw "Launcher contains non-ASCII bytes" }
          $text = [System.Text.Encoding]::ASCII.GetString($data)
          if (-not $text.Contains('%~dp0backend\server.py')) { throw "Launcher relative backend path lost" }
